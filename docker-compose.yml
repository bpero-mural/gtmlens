services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_NAME: "Mural Lens"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mural_lens
      DB_USERNAME: app
      DB_PASSWORD: app
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      FILESYSTEM_DISK: local
      SALESFORCE_API_VERSION: "61.0"
      SECURITY_ALLOW_APEX_STORAGE: "false"
      SECURITY_ALLOW_RAW_METADATA_VIEW: "false"
      LOCAL_ADMIN_EMAIL: admin@example.test
      LOCAL_ADMIN_PASSWORD: password
      LOCAL_ADMIN_NAME: "Local Admin"
      LOCAL_ADMIN_ENSURE_ON_BOOT: "true"
    volumes:
      - .:/var/www/html
      - app_node_modules:/var/www/html/node_modules
      - snapshot_storage:/var/www/html/storage/app/snapshots
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null && test -f artisan"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mural_lens
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mural_lens"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_node_modules:
  postgres_data:
  snapshot_storage:
